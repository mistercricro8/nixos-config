"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](primary)\
$os\
$username\
[](bg:tertiary fg:primary)\
$directory\
[](fg:tertiary bg:secondary)\
$git_branch\
$git_status\
[](fg:secondary bg:tertiary_fixed)\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:tertiary_fixed bg:surface_variant)\
$docker_context\
$conda\
$pixi\
[](fg:surface_variant bg:surface_container_highest)\
$time\
[ ](fg:surface_container_highest)\
$line_break$character"""

palette = 'dms'

[palettes.dms]
# INSERT_DMS_COLORS_HERE

[os]
disabled = false
style = "bg:primary fg:on_primary"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""
NixOS = ""

[username]
show_always = true
style_user = "bg:primary fg:on_primary"
style_root = "bg:primary fg:on_primary"
format = '[ $user ]($style)'

[directory]
style = "fg:on_tertiary bg:tertiary"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:secondary"
format = '[[ $symbol $branch ](fg:on_secondary bg:secondary)]($style)'

[git_status]
style = "bg:secondary"
format = '[[($all_status$ahead_behind )](fg:on_secondary bg:secondary)]($style)'

[nodejs]
symbol = ""
style = "bg:tertiary_fixed"
format = '[[ $symbol( $version) ](fg:on_tertiary_fixed bg:tertiary_fixed)]($style)'

[bun]
symbol = ""
style = "bg:tertiary_fixed"
format = '[[ $symbol( $version) ](fg:on_tertiary_fixed bg:tertiary_fixed)]($style)'

[c]
symbol = " "
style = "bg:tertiary_fixed"
format = '[[ $symbol( $version) ](fg:on_tertiary_fixed bg:tertiary_fixed)]($style)'

[cpp]
symbol = " "
style = "bg:tertiary_fixed"
format = '[[ $symbol( $version) ](fg:on_tertiary_fixed bg:tertiary_fixed)]($style)'

[rust]
symbol = ""
style = "bg:tertiary_fixed"
format = '[[ $symbol( $version) ](fg:on_tertiary_fixed bg:tertiary_fixed)]($style)'

[golang]
symbol = ""
style = "bg:tertiary_fixed"
format = '[[ $symbol( $version) ](fg:on_tertiary_fixed bg:tertiary_fixed)]($style)'

[php]
symbol = ""
style = "bg:tertiary_fixed"
format = '[[ $symbol( $version) ](fg:on_tertiary_fixed bg:tertiary_fixed)]($style)'

[java]
symbol = ""
style = "bg:tertiary_fixed"
format = '[[ $symbol( $version) ](fg:on_tertiary_fixed bg:tertiary_fixed)]($style)'

[kotlin]
symbol = ""
style = "bg:tertiary_fixed"
format = '[[ $symbol( $version) ](fg:on_tertiary_fixed bg:tertiary_fixed)]($style)'

[haskell]
symbol = ""
style = "bg:tertiary_fixed"
format = '[[ $symbol( $version) ](fg:on_tertiary_fixed bg:tertiary_fixed)]($style)'

[python]
symbol = ""
style = "bg:tertiary_fixed"
format = '[[ $symbol( $version) ](fg:on_tertiary_fixed bg:tertiary_fixed)]($style)'

[docker_context]
symbol = ""
style = "bg:surface_variant"
format = '[[ $symbol( $context) ](fg:primary bg:surface_variant)]($style)'

[conda]
style = "bg:surface_variant"
format = '[[ $symbol( $environment) ](fg:primary bg:surface_variant)]($style)'

[pixi]
style = "bg:surface_variant"
format = '[[ $symbol( $version)( $environment) ](fg:primary bg:surface_variant)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:surface_container_highest"
format = '[[  $time ](fg:on_surface bg:surface_container_highest)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[](bold fg:tertiary)'
error_symbol = '[](bold fg:error)'
vimcmd_symbol = '[](bold fg:tertiary)'
vimcmd_replace_one_symbol = '[](bold fg:secondary)'
vimcmd_replace_symbol = '[](bold fg:secondary)'
vimcmd_visual_symbol = '[](bold fg:primary)'
